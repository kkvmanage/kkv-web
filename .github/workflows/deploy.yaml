name: Deploy KKV Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "======================================"
            echo "🚀 KKV BACKEND DEPLOYMENT STARTED"
            echo "======================================"

            cd /home/ubuntu/kkv-web

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing backend dependencies..."
            cd /home/ubuntu/kkv-web/backend
            npm install --omit=dev

            echo "🔄 Restarting backend..."
            pm2 restart kkv-backend --update-env

            echo "⏳ Waiting for backend..."
            sleep 3

            echo "📊 PM2 status..."
            pm2 status kkv-backend

            echo "🩺 Checking backend health..."
            curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/health

            echo ""
            echo "======================================"
            echo "✅ KKV BACKEND DEPLOYMENT SUCCESS"
            echo "======================================"
